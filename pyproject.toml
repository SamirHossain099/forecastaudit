[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastaudit"
version = "0.1.1"
description = "Partition-matched scoring, WIS decomposition and out-of-time recalibration for archived probabilistic forecasts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samir Hossain", email = "samir.hossain@ttu.edu" }]
keywords = [
    "forecast evaluation", "calibration", "conformal prediction",
    "weighted interval score", "score decomposition", "genomic surveillance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/SamirHossain099/forecastaudit"
Source = "https://github.com/SamirHossain099/forecastaudit"
Issues = "https://github.com/SamirHossain099/forecastaudit/issues"

# The analysis modules live in src/ as a flat set. Mapping the distribution name onto that
# directory makes `import forecastaudit.score` work without moving files, which would have
# invalidated every path in the paper and in the 226 tests.
[tool.setuptools]
packages = ["forecastaudit"]
package-dir = { "forecastaudit" = "src" }
